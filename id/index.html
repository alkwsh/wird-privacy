<!doctype html>
<html lang="id" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f1eee8">
  <title>Wird — Al-Qur’an dan zikir</title>
  <meta name="description" content="Al-Qur’an, zikir harian, dan jadwal salat dalam satu aplikasi.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Wird — Al-Qur’an dan zikir">
  <meta property="og:description" content="Al-Qur’an, zikir harian, dan jadwal salat dalam satu aplikasi.">
  <meta property="og:url" content="https://alkwsh.github.io/wird-privacy/id/">
  <meta property="og:image" content="https://alkwsh.github.io/wird-privacy/wird-mushaf-221.jpg">
  <meta property="og:image:alt" content="Wird di iPhone, dengan layar utama dan mushaf dalam mode terang dan gelap.">
  <link rel="canonical" href="https://alkwsh.github.io/wird-privacy/id/">
  <link rel="alternate" hreflang="ar" href="https://alkwsh.github.io/wird-privacy/">
  <link rel="alternate" hreflang="en" href="https://alkwsh.github.io/wird-privacy/en/">
  <link rel="alternate" hreflang="id" href="https://alkwsh.github.io/wird-privacy/id/">
  <link rel="alternate" hreflang="x-default" href="https://alkwsh.github.io/wird-privacy/">
  <link rel="icon" type="image/png" href="../wird-icon-221.png">
  <link rel="apple-touch-icon" href="../wird-icon-221.png">
  <style>
@font-face{font-family:Wird;src:url("../Wird-TheSansArabic-Plain.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:Wird;src:url("../Wird-TheSansArabic-Bold.otf") format("opentype");font-weight:700;font-display:swap}
:root{color-scheme:light;background:#f1eee8;color:#252525;font-family:Wird,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
main{width:100%;flex:1;display:flex;flex-direction:column}
.language-picker{position:absolute;top:calc(.7rem + env(safe-area-inset-top));left:1rem;z-index:2;max-width:calc(100% - 2rem);min-height:2.5rem;border:1px solid #d8d6d0;border-radius:.75rem;background-color:#fffd;color:#252525;padding:.32rem .72rem;font:400 1rem Wird,system-ui,sans-serif;cursor:pointer}
.language-picker:focus-visible{outline:3px solid #76593b;outline-offset:4px}
.intro{display:flex;align-items:center;flex-direction:column;text-align:center;padding:calc(clamp(62px,9svh,86px) + env(safe-area-inset-top)) 22px clamp(24px,4.8svh,55px)}
.brand{display:flex;align-items:center;justify-content:center;gap:clamp(16px,4vw,24px)}
.app-icon{width:clamp(68px,20vw,104px);height:auto;border-radius:24%;transform:rotate(-12deg);box-shadow:0 7px 16px #201d2424}
[dir=rtl] .app-icon{transform:rotate(12deg)}
h1{font-size:clamp(3rem,14vw,4.25rem);line-height:1.15;margin:0;font-weight:700}
.description{max-width:34rem;font-size:clamp(1.06rem,4.6vw,1.375rem);line-height:1.65;margin:clamp(1rem,3.5svh,1.65rem) 0 1rem;text-wrap:balance;color:#585650}
.store-link{display:block;line-height:0;border-radius:12px}
.store-link img{display:block;width:156px;height:52px}
a:focus-visible{outline:3px solid #76593b;outline-offset:5px}
.hint{max-width:24rem;margin:.85rem 0 0;color:#60574d;font-size:.925rem;line-height:1.55;text-wrap:balance}
.hint[hidden]{display:none}
.screens{direction:ltr;width:100%;overflow:hidden;position:relative;isolation:isolate;min-height:17.4rem;height:min(46svh,32rem);flex:1}
.screens::after{content:"";position:absolute;inset:auto 0 0;height:3.4rem;background:linear-gradient(0deg,#f1eee8,transparent);pointer-events:none}
.phones{--phone:clamp(9.25rem,24vw,16.6rem);display:flex;justify-content:center;align-items:flex-start;position:absolute;top:0;left:50%;transform:translateX(-50%);padding-top:.85rem}
.phone{width:var(--phone);background:#222124;flex:none;border:1px solid #635f62;padding:clamp(4px,1vw,8px);border-radius:clamp(1.35rem,4vw,2.8rem);box-shadow:0 13px 34px #26202c38;overflow:hidden}
.phone img{display:block;width:100%;height:auto;border-radius:clamp(1.04rem,3.45vw,2.35rem)}
.phone--left{transform:translateX(8%) translateY(12%) rotate(-12deg)}
.phone--right{transform:translateX(-8%) translateY(12%) rotate(12deg)}
.phone--center{width:calc(var(--phone) * 1.12);position:relative;z-index:1}
footer{padding:.65rem 1rem calc(.65rem + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.1rem .9rem}
footer a{color:#54504a;padding:.35rem .1rem;font-size:.82rem;text-underline-offset:.2em}
@media(max-height:620px){
 .intro{padding-top:calc(58px + env(safe-area-inset-top));padding-bottom:1.4rem}
 .app-icon{width:65px}
 h1{font-size:3rem}
 .description{margin:.85rem 0 .7rem;font-size:1.05rem}
}
</style>
</head>
<body>
  <select id="language-picker" class="language-picker" aria-label="Language">
    <option value="ar" lang="ar">🇸🇦 العربية</option>
    <option value="en" lang="en">🇬🇧 English</option>
    <option value="id" lang="id" selected>🇮🇩 Indonesia</option>
    <option value="hi" lang="hi">🇮🇳 हिन्दी</option>
    <option value="tr" lang="tr">🇹🇷 Türkçe</option>
    <option value="ur" lang="ur">🇵🇰 اردو</option>
    <option value="bn" lang="bn">🇧🇩 বাংলা</option>
    <option value="fa" lang="fa">🇮🇷 فارسی</option>
    <option value="fr" lang="fr">🇫🇷 Français</option>
    <option value="sw" lang="sw">🇹🇿 Kiswahili</option>
  </select>
  <main>
    <header class="intro">
      <div class="brand">
        <img class="app-icon" src="../wird-icon-221.png" width="152" height="152" alt="">
        <h1>Wird</h1>
      </div>
      <p class="description">Al-Qur’an, zikir harian, dan jadwal salat dalam satu aplikasi.</p>
      <a class="store-link" id="store" href="https://apps.apple.com/id/app/wird-quran-dhikr-prayer/id6804229456" aria-label="Unduh Wird di App Store">
        <img src="../wird-app-store.svg" width="156" height="52" alt="">
      </a>
      <p class="hint" id="tiktok-help" hidden>Jika App Store tidak terbuka, pilih Buka di Safari dari menu ⋯ di TikTok.</p>
    </header>
    <div class="screens" role="img" aria-label="Wird di iPhone, dengan layar utama dan mushaf dalam mode terang dan gelap.">
      <div class="phones" aria-hidden="true">
        <div class="phone phone--left"><img src="../wird-dark-221.jpg" width="719" height="1564" alt=""></div>
        <div class="phone phone--center"><img src="../wird-mushaf-221.jpg" width="719" height="1564" alt="" fetchpriority="high"></div>
        <div class="phone phone--right"><img src="../wird-home-221.jpg" width="719" height="1564" alt=""></div>
      </div>
    </div>
  </main>
  <footer>
    <a id="privacy" data-root="../privacy/" href="../privacy/en/">Privasi</a>
  </footer>
  <script>
(() => {

  const copy = {
    ar:['وِرد','القرآن الكريم، والأذكار، ومواقيت الصلاة في تطبيق واحد.','تنزيل وِرد من App Store','واجهات وِرد على الآيفون والآيباد'],
    en:['Wird','The Quran, daily dhikr and prayer times, together in one app.','Download Wird on the App Store','Wird on iPhone and iPad'],
    fr:['Wird','Le Coran, le dhikr et les horaires de prière dans une seule application.','Télécharger Wird sur l’App Store','Wird sur iPhone et iPad'],
    tr:['Wird','Kur’an, günlük zikirler ve namaz vakitleri tek uygulamada.','Wird’ü App Store’dan indirin','iPhone ve iPad’de Wird'],
    ur:['وِرد','قرآن، روزانہ کے اذکار اور نماز کے اوقات، ایک ہی ایپ میں۔','App Store سے وِرد ڈاؤن لوڈ کریں','آئی فون اور آئی پیڈ پر وِرد'],
    id:['Wird','Al-Qur’an, zikir harian, dan waktu salat dalam satu aplikasi.','Unduh Wird di App Store','Wird di iPhone dan iPad'],
    hi:['Wird','क़ुरआन, रोज़ाना के अज़कार और नमाज़ के समय, एक ऐप में।','App Store से Wird डाउनलोड करें','iPhone और iPad पर Wird'],
    bn:['Wird','কুরআন, দৈনন্দিন যিকর ও নামাজের সময়, এক অ্যাপে।','App Store থেকে Wird ডাউনলোড করুন','iPhone ও iPad-এ Wird'],
    sw:['Wird','Qur’ani, dhikri za kila siku na nyakati za sala katika programu moja.','Pakua Wird kwenye App Store','Wird kwenye iPhone na iPad'],
    fa:['ورد','قرآن، ذکرهای روزانه و اوقات نماز در یک برنامه.','دریافت ورد از App Store','ورد در آیفون و آیپد']
  };
  // The device gallery on this page shows iPhones.
  const images = {
    ar: 'واجهات وِرد على الآيفون', en: 'Wird on iPhone', id: 'Wird di iPhone',
    hi: 'iPhone पर Wird', tr: 'iPhone’da Wird', ur: 'آئی فون پر وِرد',
    bn: 'iPhone-এ Wird', fa: 'ورد در آیفون', fr: 'Wird sur iPhone', sw: 'Wird kwenye iPhone'
  };
  const labels = {
    ar: ['اللغة', 'الخصوصية'], en: ['Language', 'Privacy'], id: ['Bahasa', 'Privasi'],
    hi: ['भाषा', 'गोपनीयता'], tr: ['Dil', 'Gizlilik'], ur: ['زبان', 'رازداری'],
    bn: ['ভাষা', 'গোপনীয়তা'], fa: ['زبان', 'حریم خصوصی'], fr: ['Langue', 'Confidentialité'],
    sw: ['Lugha', 'Faragha']
  };
  const help = {
    ar: 'إذا لم يفتح المتجر، افتح الرابط في Safari من قائمة ⋯ في تيك توك.',
    en: 'If the store doesn’t open, choose Open in Safari from TikTok’s ⋯ menu.',
    id: 'Jika App Store tidak terbuka, pilih Buka di Safari dari menu ⋯ di TikTok.',
    hi: 'अगर App Store नहीं खुलता, तो TikTok के ⋯ मेनू से लिंक Safari में खोलें।',
    tr: 'App Store açılmazsa TikTok’un ⋯ menüsünden bağlantıyı Safari’de açın.',
    ur: 'اگر App Store نہ کھلے تو TikTok کے ⋯ مینیو سے لنک Safari میں کھولیں۔',
    bn: 'App Store না খুললে TikTok-এর ⋯ মেনু থেকে লিঙ্কটি Safari-তে খুলুন।',
    fa: 'اگر App Store باز نشد، از منوی ⋯ تیک‌تاک پیوند را در Safari باز کنید.',
    fr: 'Si l’App Store ne s’ouvre pas, ouvrez le lien dans Safari depuis le menu ⋯ de TikTok.',
    sw: 'Ikiwa App Store haifunguki, fungua kiungo katika Safari kupitia menyu ya ⋯ ya TikTok.'
  };
  const params = new URLSearchParams(location.search);
  const picker = document.getElementById("language-picker");
  const store = document.getElementById("store");
  const hint = document.getElementById("tiktok-help");
  const privacy = document.getElementById("privacy");
  const privacyRoot = new URL(privacy.dataset.root, location.href);
  function render(language) {
    const [name, description, download] = copy[language];
    document.documentElement.lang = language;
    document.documentElement.dir = ["ar", "ur", "fa"].includes(language) ? "rtl" : "ltr";
    document.title = name + " — " + description;
    document.querySelector('meta[name="description"]').content = description;
    document.querySelector("h1").textContent = name;
    document.querySelector(".description").textContent = description;
    document.querySelector(".screens").setAttribute("aria-label", images[language]);
    store.setAttribute("aria-label", download);
    const market = { ar: "kw", id: "id" }[language] || "us";
    store.href = "https://apps.apple.com/" + market + "/app/wird-quran-dhikr-prayer/id6804229456";
    picker.setAttribute("aria-label", labels[language][0]);
    picker.value = language;
    privacy.textContent = labels[language][1];
    privacy.href = new URL(language === "ar" ? "./" : "en/", privacyRoot).href;
    hint.textContent = help[language];
  }
  function isLanguage(language) {
    return Object.hasOwn(copy, language);
  }
  const requested = params.get("lang");
  render(isLanguage(requested) ? requested : document.documentElement.lang);
  picker.addEventListener("change", () => {
    if (!isLanguage(picker.value)) return;
    const url = new URL(location.href);
    url.searchParams.set("lang", picker.value);
    history.replaceState(history.state, "", url);
    render(picker.value);
  });
  const agent = navigator.userAgent;
  const isiOS = /iPhone|iPad|iPod/i.test(agent)
    || (/Macintosh/i.test(agent) && navigator.maxTouchPoints > 1);
  const insideTikTok = /TikTok|BytedanceWebview|musical_ly|Aweme|trill/i.test(agent);
  if (insideTikTok && isiOS) hint.hidden = false;
  if (!isiOS || new URLSearchParams(location.search).get("preview") === "1"
      || history.state?.wirdStoreAttempted) return;

  const appStoreDestination = "itms-apps://itunes.apple.com/app/id6804229456";
  let tapped = false;
  store.addEventListener("click", () => { tapped = true; });
  window.setTimeout(() => {
    if (tapped || document.visibilityState !== "visible") return;
    history.replaceState({ ...history.state, wirdStoreAttempted: true }, "");
    location.assign(appStoreDestination);
  }, 650);
})();
</script>
</body>
</html>
